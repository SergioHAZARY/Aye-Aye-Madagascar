# Publie le site sur GitHub Pages a chaque push sur main.
#
#   https://sergiohazary.github.io/Aye-Aye-Madagascar/
#
# Le site est servi dans le sous-dossier /Aye-Aye-Madagascar : le build recoit
# NEXT_PUBLIC_BASE_PATH, repris par next.config.mjs (basePath) et par
# app/lib/chemin.js (tous les liens et images du site).
# Suivi des publications : onglet « Actions » du depot.

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # relance manuelle depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication a la fois ; un nouveau push remplace celle en cours
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site statique
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Aye-Aye-Madagascar

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
